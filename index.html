<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Space Explorer App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>NASA Space Explorer App</h1>
        <p>Explore the cosmos through NASA's Astronomy Picture of the Day</p>
    </header>

    <main>
        <section class="controls">
            <div class="date-picker-container">
                <label for="start-date">Start Date:</label>
                <input type="date" id="start-date">
                
                <label for="end-date">End Date:</label>
                <input type="date" id="end-date">
                
                <button id="fetch-btn">Get Space Images</button>
            </div>
        </section>

        <div id="loading" class="hidden">
            <p>Loading space exploration data...</p>
        </div>

        <section id="gallery" class="gallery-grid">
            <!-- Dynamic gallery cards will load here -->
        </section>
    </main>

    <!-- Modal with 'hidden' class added by default -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal" class="close-btn">&times;</span>
            <div id="modal-body">
                <!-- Detailed content injected via JS -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
